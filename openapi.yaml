openapi: 3.0.3
info:
  title: AquaPiol Inventory Integration API
  version: 1.0.0
  description: |
    HTTP/JSON interface used by the POS, Customers Log, HR, and Accounting systems.
    AquaPiol owns stock and the movement ledger only. Customers and employees are
    referenced by external IDs; they are never mastered here.

    Conventions:
    - Money is a decimal STRING with 2 places ("12.50"). Never a float.
    - Stock quantities are INTEGERS (whole units).
    - Timestamps are ISO-8601 with a +08:00 offset.
    - Every error is `{ error: { code, message, details, request_id } }`.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - serviceToken: []
paths:
  /health:
    get:
      summary: Liveness and database check (no token required)
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      database: { type: string, example: up }
                      version: { type: string, example: 1.0.0 }
                      server_time: { type: string, example: "2026-11-09T15:30:00+08:00" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "503":
          description: Database unreachable
  /products:
    get:
      summary: List products
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: sku, schema: { type: string } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: active, schema: { type: boolean, default: true } }
        - { in: query, name: low_stock, schema: { type: boolean } }
        - { in: query, name: updated_since, schema: { type: string, format: date-time } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Paginated catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products/{sku}:
    get:
      summary: Read one product by SKU
      parameters:
        - { in: path, name: sku, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      summary: List categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        description: { type: string, nullable: true }
  /suppliers:
    get:
      summary: List suppliers
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
  /stock/levels:
    get:
      summary: Current quantity per SKU
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        name: { type: string }
                        unit: { type: string }
                        quantity: { type: integer }
                        reorder_level: { type: integer }
                        status:
                          type: string
                          enum: [in_stock, low_stock, out_of_stock]
  /stock/movements:
    get:
      summary: Read the stock ledger (Accounting)
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: sku, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [in, out, adjustment] } }
        - { in: query, name: source_system, schema: { type: string } }
        - { in: query, name: reference, schema: { type: string } }
        - { in: query, name: customer_ref, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: Ledger page plus totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Movement" }
                  totals:
                    type: object
                    properties:
                      in_total: { type: integer }
                      out_total: { type: integer }
                      adjustment_total: { type: integer }
                  meta: { $ref: "#/components/schemas/Meta" }
  /stock/movements/bulk:
    post:
      summary: Record one or more stock movements (all-or-nothing, idempotent)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
          description: Stable per business event (receipt/order number). Retries must reuse it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, lines]
              properties:
                source_system:
                  type: string
                  enum: [pos, customers, hr, accounting, manual]
                reference:
                  type: string
                  maxLength: 60
                  description: Receipt, order, or document number.
                occurred_at:
                  type: string
                  format: date-time
                  description: Business time. Defaults to now.
                customer_ref:
                  type: string
                  maxLength: 64
                  description: External customer ID from Customers Log.
                lines:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [sku, type, quantity]
                    properties:
                      sku: { type: string }
                      type: { type: string, enum: [in, out, adjustment] }
                      quantity:
                        type: integer
                        minimum: 1
                        description: >-
                          Whole units. For adjustment this is the counted on-hand
                          quantity; for in/out it is the movement quantity.
                      unit_cost:
                        type: string
                        example: "12.50"
                      reason: { type: string }
      responses:
        "201":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reference: { type: string }
                      idempotent_replay: { type: boolean }
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            sku: { type: string }
                            movement_id: { type: integer }
                            previous_stock: { type: integer }
                            new_stock: { type: integer }
                            status: { type: string, example: applied }
                  meta: { $ref: "#/components/schemas/Meta" }
        "200":
          description: Replayed stored response for the same Idempotency-Key
        "409":
          description: Insufficient stock, duplicate key with a different body, or duplicate reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /stock/valuation:
    get:
      summary: Inventory valuation
      parameters:
        - { in: query, name: as_of, schema: { type: string, format: date-time } }
        - { in: query, name: category_id, schema: { type: integer } }
      responses:
        "200":
          description: Valuation lines and grand total
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      as_of: { type: string }
                      costing_method: { type: string, example: standard_cost_snapshot }
                      currency: { type: string, example: PHP }
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            sku: { type: string }
                            quantity: { type: integer }
                            unit_cost: { type: string }
                            value: { type: string }
                      total_value: { type: string }
  /:
    get:
      summary: API index, conventions and per-system endpoint catalogue
      security: []
      responses:
        "200":
          description: Service catalogue
  /me:
    get:
      summary: Resolve the presented token to a service, its scopes and actor account
      responses:
        "200":
          description: Token identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service: { type: string, example: pos }
                      scopes:
                        type: array
                        items: { type: string }
                      actor:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid service token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        category:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        supplier:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        cost_price: { type: string, example: "12.50" }
        selling_price: { type: string, example: "30.00" }
        quantity: { type: integer, example: 48 }
        reorder_level: { type: integer, example: 10 }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        updated_at: { type: string }
    Movement:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [in, out, adjustment] }
        quantity: { type: integer }
        previous_stock: { type: integer }
        new_stock: { type: integer }
        unit_cost: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        customer_ref: { type: string, nullable: true }
        source_system: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        occurred_at: { type: string }
        created_at: { type: string }
        product:
          type: object
          properties:
            id: { type: integer }
            sku: { type: string }
            name: { type: string }
            unit: { type: string }
        actor:
          type: object
          properties:
            user_id: { type: integer }
            name: { type: string }
            external_employee_id: { type: string, nullable: true }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_ERROR
                - INSUFFICIENT_STOCK
                - DUPLICATE_REQUEST
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
            message: { type: string }
            details: { nullable: true }
            request_id: { type: string }
