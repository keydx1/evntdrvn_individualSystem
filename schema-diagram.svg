<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>
  <rect width="1200" height="60" fill="url(#headerGrad)"/>
  <text x="600" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">AquaPiol — Database Schema</text>

  <!-- ===================== USERS ===================== -->
  <g transform="translate(480, 90)" filter="url(#shadow)">
    <rect width="240" height="280" rx="10" fill="#fff" stroke="#1a73e8" stroke-width="2"/>
    <rect width="240" height="40" rx="10" fill="url(#headerGrad)"/>
    <rect y="20" width="240" height="20" fill="url(#headerGrad)"/>
    <text x="120" y="26" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">users</text>
    <text x="120" y="68" text-anchor="middle" fill="#555" font-size="11">PK ID · auto-increment</text>
    <line x1="20" y1="76" x2="220" y2="76" stroke="#e2e8f0"/>
    <text x="20" y="96" fill="#334155" font-size="12" font-weight="600">name</text>
    <text x="20" y="112" fill="#64748b" font-size="11">VARCHAR(120) · required</text>
    <line x1="20" y1="118" x2="220" y2="118" stroke="#e2e8f0"/>
    <text x="20" y="138" fill="#334155" font-size="12" font-weight="600">email</text>
    <text x="20" y="154" fill="#64748b" font-size="11">VARCHAR(150) · UNIQUE · required</text>
    <line x1="20" y1="160" x2="220" y2="160" stroke="#e2e8f0"/>
    <text x="20" y="180" fill="#334155" font-size="12" font-weight="600">password</text>
    <text x="20" y="196" fill="#64748b" font-size="11">VARCHAR(255) · bcrypt hash</text>
    <line x1="20" y1="202" x2="220" y2="202" stroke="#e2e8f0"/>
    <text x="20" y="222" fill="#334155" font-size="12" font-weight="600">role</text>
    <text x="20" y="238" fill="#64748b" font-size="11">ENUM(admin, staff) · default: staff</text>
    <line x1="20" y1="244" x2="220" y2="244" stroke="#e2e8f0"/>
    <text x="20" y="264" fill="#334155" font-size="12" font-weight="600">isActive</text>
    <text x="20" y="280" fill="#64748b" font-size="11">BOOLEAN · default: true</text>
  </g>

  <!-- ===================== CATEGORIES ===================== -->
  <g transform="translate(30, 90)" filter="url(#shadow)">
    <rect width="210" height="200" rx="10" fill="#fff" stroke="#059669" stroke-width="2"/>
    <rect width="210" height="36" rx="10" fill="#059669"/>
    <rect y="16" width="210" height="20" fill="#059669"/>
    <text x="105" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">categories</text>
    <text x="105" y="56" text-anchor="middle" fill="#555" font-size="11">PK ID · auto-increment</text>
    <line x1="15" y1="64" x2="195" y2="64" stroke="#e2e8f0"/>
    <text x="15" y="82" fill="#334155" font-size="12" font-weight="600">name</text>
    <text x="15" y="96" fill="#64748b" font-size="11">VARCHAR(100) · UNIQUE · required</text>
    <line x1="15" y1="102" x2="195" y2="102" stroke="#e2e8f0"/>
    <text x="15" y="120" fill="#334155" font-size="12" font-weight="600">description</text>
    <text x="15" y="134" fill="#64748b" font-size="11">VARCHAR(255) · optional</text>
    <line x1="15" y1="140" x2="195" y2="140" stroke="#e2e8f0"/>
    <text x="15" y="158" fill="#334155" font-size="12" font-weight="600">isActive</text>
    <text x="15" y="172" fill="#64748b" font-size="11">BOOLEAN · default: true</text>
  </g>

  <!-- ===================== SUPPLIERS ===================== -->
  <g transform="translate(30, 320)" filter="url(#shadow)">
    <rect width="210" height="260" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <rect width="210" height="36" rx="10" fill="#d97706"/>
    <rect y="16" width="210" height="20" fill="#d97706"/>
    <text x="105" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">suppliers</text>
    <text x="105" y="56" text-anchor="middle" fill="#555" font-size="11">PK ID · auto-increment</text>
    <line x1="15" y1="64" x2="195" y2="64" stroke="#e2e8f0"/>
    <text x="15" y="82" fill="#334155" font-size="12" font-weight="600">name</text>
    <text x="15" y="96" fill="#64748b" font-size="11">VARCHAR(150) · UNIQUE · required</text>
    <line x1="15" y1="102" x2="195" y2="102" stroke="#e2e8f0"/>
    <text x="15" y="120" fill="#334155" font-size="12" font-weight="600">contactPerson</text>
    <text x="15" y="134" fill="#64748b" font-size="11">VARCHAR(120)</text>
    <line x1="15" y1="140" x2="195" y2="140" stroke="#e2e8f0"/>
    <text x="15" y="158" fill="#334155" font-size="12" font-weight="600">phone</text>
    <text x="15" y="172" fill="#64748b" font-size="11">VARCHAR(40)</text>
    <line x1="15" y1="178" x2="195" y2="178" stroke="#e2e8f0"/>
    <text x="15" y="196" fill="#334155" font-size="12" font-weight="600">email</text>
    <text x="15" y="210" fill="#64748b" font-size="11">VARCHAR(150) · validated</text>
    <line x1="15" y1="216" x2="195" y2="216" stroke="#e2e8f0"/>
    <text x="15" y="234" fill="#334155" font-size="12" font-weight="600">address</text>
    <text x="15" y="248" fill="#64748b" font-size="11">VARCHAR(255)</text>
    <line x1="15" y1="254" x2="195" y2="254" stroke="#e2e8f0"/>
    <text x="15" y="272" fill="#334155" font-size="12" font-weight="600">notes</text>
    <text x="15" y="286" fill="#64748b" font-size="11">TEXT</text>
    <line x1="15" y1="292" x2="195" y2="292" stroke="#e2e8f0"/>
    <text x="15" y="310" fill="#334155" font-size="12" font-weight="600">isActive</text>
    <text x="15" y="324" fill="#64748b" font-size="11">BOOLEAN · default: true</text>
  </g>

  <!-- ===================== PRODUCTS ===================== -->
  <g transform="translate(290, 390)" filter="url(#shadow)">
    <rect width="260" height="340" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="260" height="36" rx="10" fill="#7c3aed"/>
    <rect y="16" width="260" height="20" fill="#7c3aed"/>
    <text x="130" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">products</text>
    <text x="130" y="56" text-anchor="middle" fill="#555" font-size="11">PK ID · auto-increment</text>
    <line x1="15" y1="64" x2="245" y2="64" stroke="#e2e8f0"/>
    <text x="15" y="84" fill="#334155" font-size="12" font-weight="600">sku</text>
    <text x="15" y="100" fill="#64748b" font-size="11">VARCHAR(50) · UNIQUE · required</text>
    <line x1="15" y1="106" x2="245" y2="106" stroke="#e2e8f0"/>
    <text x="15" y="126" fill="#334155" font-size="12" font-weight="600">name</text>
    <text x="15" y="142" fill="#64748b" font-size="11">VARCHAR(150) · required</text>
    <line x1="15" y1="148" x2="245" y2="148" stroke="#e2e8f0"/>
    <text x="15" y="168" fill="#334155" font-size="12" font-weight="600">categoryId</text>
    <text x="15" y="184" fill="#64748b" font-size="11">INT · FK → categories(RESTRICT)</text>
    <line x1="15" y1="190" x2="245" y2="190" stroke="#e2e8f0"/>
    <text x="15" y="210" fill="#334155" font-size="12" font-weight="600">supplierId</text>
    <text x="15" y="226" fill="#64748b" font-size="11">INT · FK → suppliers(SET NULL)</text>
    <line x1="15" y1="232" x2="245" y2="232" stroke="#e2e8f0"/>
    <text x="15" y="252" fill="#334155" font-size="12" font-weight="600">unit</text>
    <text x="15" y="268" fill="#64748b" font-size="11">VARCHAR(30) · default: 'piece'</text>
    <line x1="15" y1="274" x2="245" y2="274" stroke="#e2e8f0"/>
    <text x="15" y="294" fill="#334155" font-size="12" font-weight="600">quantity</text>
    <text x="15" y="310" fill="#64748b" font-size="11">INT · min: 0 · default: 0</text>
    <line x1="15" y1="316" x2="245" y2="316" stroke="#e2e8f0"/>
    <text x="15" y="336" fill="#334155" font-size="12" font-weight="600">reorderLevel</text>
    <text x="15" y="352" fill="#64748b" font-size="11">INT · min: 0 · default: 10</text>
    <line x1="15" y1="358" x2="245" y2="358" stroke="#e2e8f0"/>
    <text x="15" y="378" fill="#334155" font-size="12" font-weight="600">costPrice</text>
    <text x="15" y="394" fill="#64748b" font-size="11">DECIMAL(12,2) · min: 0</text>
    <line x1="15" y1="400" x2="245" y2="400" stroke="#e2e8f0"/>
    <text x="15" y="420" fill="#334155" font-size="12" font-weight="600">sellingPrice</text>
    <text x="15" y="436" fill="#64748b" font-size="11">DECIMAL(12,2) · min: 0</text>
    <line x1="15" y1="442" x2="245" y2="442" stroke="#e2e8f0"/>
    <text x="15" y="462" fill="#334155" font-size="12" font-weight="600">location</text>
    <text x="15" y="478" fill="#64748b" font-size="11">VARCHAR(100)</text>
    <line x1="15" y1="484" x2="245" y2="484" stroke="#e2e8f0"/>
    <text x="15" y="504" fill="#334155" font-size="12" font-weight="600">description</text>
    <text x="15" y="520" fill="#64748b" font-size="11">TEXT</text>
    <line x1="15" y1="526" x2="245" y2="526" stroke="#e2e8f0"/>
    <text x="15" y="546" fill="#334155" font-size="12" font-weight="600">isActive</text>
    <text x="15" y="562" fill="#64748b" font-size="11">BOOLEAN · default: true (archive)</text>
  </g>

  <!-- ===================== STOCK_MOVEMENTS ===================== -->
  <g transform="translate(600, 390)" filter="url(#shadow)">
    <rect width="300" height="420" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <rect width="300" height="36" rx="10" fill="#dc2626"/>
    <rect y="16" width="300" height="20" fill="#dc2626"/>
    <text x="150" y="24" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">stock_movements</text>
    <text x="150" y="56" text-anchor="middle" fill="#555" font-size="11">PK ID · auto-increment</text>
    <line x1="15" y1="64" x2="285" y2="64" stroke="#e2e8f0"/>
    <text x="15" y="84" fill="#334155" font-size="12" font-weight="600">productId</text>
    <text x="15" y="100" fill="#64748b" font-size="11">INT · FK → products(RESTRICT)</text>
    <line x1="15" y1="106" x2="285" y2="106" stroke="#e2e8f0"/>
    <text x="15" y="126" fill="#334155" font-size="12" font-weight="600">userId</text>
    <text x="15" y="142" fill="#64748b" font-size="11">INT · FK → users(RESTRICT)</text>
    <line x1="15" y1="148" x2="285" y2="148" stroke="#e2e8f0"/>
    <text x="15" y="168" fill="#334155" font-size="12" font-weight="600">supplierId</text>
    <text x="15" y="184" fill="#64748b" font-size="11">INT · FK → suppliers(SET NULL)</text>
    <line x1="15" y1="190" x2="285" y2="190" stroke="#e2e8f0"/>
    <text x="15" y="210" fill="#334155" font-size="12" font-weight="600">type</text>
    <text x="15" y="226" fill="#64748b" font-size="11">ENUM(in, out, adjustment)</text>
    <line x1="15" y1="232" x2="285" y2="232" stroke="#e2e8f0"/>
    <text x="15" y="252" fill="#334155" font-size="12" font-weight="600">quantity</text>
    <text x="15" y="268" fill="#64748b" font-size="11">INT · signed (+in, -out, +/-adj)</text>
    <line x1="15" y1="274" x2="285" y2="274" stroke="#e2e8f0"/>
    <text x="15" y="294" fill="#334155" font-size="12" font-weight="600">previousStock</text>
    <text x="15" y="310" fill="#64748b" font-size="11">INT · balance before movement</text>
    <line x1="15" y1="316" x2="285" y2="316" stroke="#e2e8f0"/>
    <text x="15" y="336" fill="#334155" font-size="12" font-weight="600">newStock</text>
    <text x="15" y="352" fill="#64748b" font-size="11">INT · balance after movement</text>
    <line x1="15" y1="358" x2="285" y2="358" stroke="#e2e8f0"/>
    <text x="15" y="378" fill="#334155" font-size="12" font-weight="600">unitCost</text>
    <text x="15" y="394" fill="#64748b" font-size="11">DECIMAL(12,2) · nullable</text>
    <line x1="15" y1="400" x2="285" y2="400" stroke="#e2e8f0"/>
    <text x="15" y="420" fill="#334155" font-size="12" font-weight="600">reference</text>
    <text x="15" y="436" fill="#64748b" font-size="11">VARCHAR(60) · e.g. OPENING-SKU</text>
    <line x1="15" y1="442" x2="285" y2="442" stroke="#e2e8f0"/>
    <text x="15" y="462" fill="#334155" font-size="12" font-weight="600">notes</text>
    <text x="15" y="478" fill="#64748b" font-size="11">TEXT</text>
    <line x1="15" y1="484" x2="285" y2="484" stroke="#e2e8f0"/>
    <text x="15" y="506" fill="#334155" font-size="12" font-weight="600">createdAt</text>
    <text x="15" y="522" fill="#64748b" font-size="11">DATETIME · no updatedAt</text>
  </g>

  <!-- ===================== RELATIONSHIPS ===================== -->
  <!-- categories → products (1:N) -->
  <line x1="240" y1="290" x2="290" y2="560" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- suppliers → products (1:N) -->
  <line x1="240" y1="450" x2="290" y2="490" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- suppliers → stock_movements (1:N) -->
  <line x1="240" y1="520" x2="600" y2="520" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- products → stock_movements (1:N) -->
  <line x1="550" y1="560" x2="600" y2="540" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- users → stock_movements (1:N) -->
  <line x1="720" y1="290" x2="600" y2="520" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <g transform="translate(930, 90)">
    <rect width="250" height="240" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="125" y="30" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">Relationships</text>
    <line x1="15" y1="44" x2="235" y2="44" stroke="#e2e8f0"/>
    <circle cx="25" cy="62" r="5" fill="#059669"/>
    <text x="40" y="66" fill="#334155" font-size="12">categories 1 ──┼──&gt; N products</text>
    <text x="40" y="82" fill="#64748b" font-size="11">onDelete: RESTRICT</text>
    <line x1="15" y1="92" x2="235" y2="92" stroke="#e2e8f0"/>
    <circle cx="25" cy="110" r="5" fill="#d97706"/>
    <text x="40" y="114" fill="#334155" font-size="12">suppliers 1 ──┼──&gt; N products</text>
    <text x="40" y="130" fill="#64748b" font-size="11">onDelete: SET NULL</text>
    <line x1="15" y1="140" x2="235" y2="140" stroke="#e2e8f0"/>
    <circle cx="25" cy="158" r="5" fill="#7c3aed"/>
    <text x="40" y="162" fill="#334155" font-size="12">products 1 ──┼──&gt; N movements</text>
    <text x="40" y="178" fill="#64748b" font-size="11">onDelete: RESTRICT</text>
    <line x1="15" y1="188" x2="235" y2="188" stroke="#e2e8f0"/>
    <circle cx="25" cy="206" r="5" fill="#1a73e8"/>
    <text x="40" y="210" fill="#334155" font-size="12">users 1 ──┼──&gt; N movements</text>
    <text x="40" y="226" fill="#64748b" font-size="11">onDelete: RESTRICT</text>
  </g>

  <!-- Footer note -->
  <text x="600" y="870" text-anchor="middle" fill="#94a3b8" font-size="12">All tables use InnoDB · utf8mb4_unicode_ci · timezone +08:00 (Philippines)</text>
</svg>
